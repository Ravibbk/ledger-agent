services:
  - type: web
    name: ledger-agent
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
