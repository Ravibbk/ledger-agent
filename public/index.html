<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- Reset & tokens ---- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1a1a2e;
  --fog:#f4f4f6;
  --fog-mid:#eaeaee;
  --rule:#d8d8e0;
  --cobalt:#2c5282;
  --cobalt-light:#3b6ea8;
  --amber:#c97d12;
  --amber-bg:#fef3dc;
  --amber-rule:#e8a832;
  --text-secondary:#6b6b80;
  --text-muted:#9898ac;
  --surface:#ffffff;
  --surface-raised:#f9f9fb;
  --serif:'Newsreader',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --rail-w:260px;
  --gutter-w:72px;
  --radius:6px;
}

@media (prefers-color-scheme:dark){
  :root{
    --ink:#e8e8f0;
    --fog:#12121e;
    --fog-mid:#1c1c2c;
    --rule:#2e2e42;
    --cobalt:#90b4e8;
    --cobalt-light:#aaccf5;
    --amber:#e8a832;
    --amber-bg:#2a2010;
    --amber-rule:#c97d12;
    --text-secondary:#9898b8;
    --text-muted:#5a5a72;
    --surface:#1a1a2e;
    --surface-raised:#1e1e30;
  }
}

html,body{height:100%;font-family:var(--sans);background:var(--fog);color:var(--ink);font-size:15px;line-height:1.5}

/* ---- Layout ---- */
#app{display:flex;height:100vh;overflow:hidden}

/* ---- Rail ---- */
#rail{
  width:var(--rail-w);
  min-width:var(--rail-w);
  background:var(--surface);
  border-right:1px solid var(--rule);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#wordmark{
  padding:20px 18px 16px;
  font-family:var(--serif);
  font-size:20px;
  font-weight:600;
  letter-spacing:-0.3px;
  color:var(--ink);
  border-bottom:1px solid var(--rule);
  flex-shrink:0;
}
#wordmark span{color:var(--amber)}

#new-btn{
  margin:12px;
  padding:9px 14px;
  background:var(--fog);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
  flex-shrink:0;
  transition:background .15s;
}
#new-btn:hover{background:var(--fog-mid)}
#new-btn:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

#sessions-list{
  flex:1;
  overflow-y:auto;
  padding:4px 0 12px;
}

.session-item{
  padding:8px 18px;
  font-size:13px;
  color:var(--text-secondary);
  cursor:pointer;
  border-radius:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  transition:background .12s, color .12s;
}
.session-item:hover{background:var(--fog);color:var(--ink)}
.session-item.active{background:var(--fog-mid);color:var(--ink);font-weight:500}
.session-item:focus-visible{outline:2px solid var(--cobalt);outline-offset:-2px}

.session-date{
  display:block;
  font-size:11px;
  color:var(--text-muted);
  margin-top:1px;
}

/* ---- Main ---- */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ---- Messages ---- */
#messages{
  flex:1;
  overflow-y:auto;
  padding:0 0 24px;
  scroll-behavior:smooth;
}

.day-marker{
  display:flex;
  align-items:center;
  gap:12px;
  padding:20px 24px 8px;
}
.day-marker-line{flex:1;height:1px;background:var(--rule)}
.day-marker-label{
  font-size:11px;
  font-weight:600;
  color:var(--amber);
  background:var(--amber-bg);
  padding:2px 8px;
  border-radius:10px;
  white-space:nowrap;
}

.msg-row{
  display:flex;
  padding:6px 24px;
  gap:16px;
  align-items:flex-start;
}

.msg-gutter{
  width:var(--gutter-w);
  min-width:var(--gutter-w);
  text-align:right;
  flex-shrink:0;
  padding-top:4px;
}

.msg-time{
  font-size:11px;
  color:var(--text-muted);
  white-space:nowrap;
}

.msg-body{flex:1;min-width:0}

/* User messages */
.msg-row.user .msg-body{
  font-size:15px;
  color:var(--ink);
  white-space:pre-wrap;
  word-break:break-word;
}

/* Assistant messages */
.msg-row.assistant .msg-body{
  border-left:2px solid var(--rule);
  padding-left:14px;
}

.answer-text{
  font-family:var(--serif);
  font-size:16px;
  line-height:1.65;
  color:var(--ink);
  white-space:pre-wrap;
  word-break:break-word;
}

/* Citations as superscripts */
.answer-text sup a{
  color:var(--cobalt);
  text-decoration:none;
  font-size:11px;
  font-family:var(--sans);
}
.answer-text sup a:hover{text-decoration:underline}

/* ---- Trail (evidence block) ---- */
.trail{
  margin-top:10px;
  border-left:3px solid var(--amber-rule);
  padding:8px 12px;
  background:var(--amber-bg);
  border-radius:0 var(--radius) var(--radius) 0;
  font-size:12px;
  color:var(--text-secondary);
  font-family:var(--sans);
}

.trail-item{
  display:flex;
  align-items:baseline;
  gap:6px;
  line-height:1.5;
}
.trail-item + .trail-item{margin-top:3px}

.trail-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--amber-rule);
  flex-shrink:0;
  position:relative;
  top:1px;
}

.trail-dot.pulsing{
  animation:pulse 1.2s ease-in-out infinite;
}
@media (prefers-reduced-motion:reduce){
  .trail-dot.pulsing{animation:none;opacity:.5}
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(0.7)}
}

.date-mark{
  color:var(--amber);
  font-weight:600;
}

/* ---- Sources ---- */
.sources-toggle{
  margin-top:8px;
  font-size:12px;
  color:var(--cobalt);
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
  font-family:var(--sans);
  text-decoration:underline;
}
.sources-toggle:focus-visible{outline:2px solid var(--cobalt);border-radius:2px}

.sources-list{
  margin-top:6px;
  padding-left:4px;
  display:none;
}
.sources-list.open{display:block}

.source-item{
  font-size:12px;
  padding:4px 0;
  border-bottom:1px solid var(--rule);
  color:var(--text-secondary);
}
.source-item:last-child{border-bottom:none}
.source-item a{color:var(--cobalt);text-decoration:none}
.source-item a:hover{text-decoration:underline}
.source-authority{
  font-size:10px;
  margin-left:4px;
  padding:1px 5px;
  border-radius:8px;
  font-weight:500;
}
.authority-official{background:#dcf0e0;color:#1a6e30}
.authority-press{background:#dce8f8;color:#1a3a6e}
.authority-other{background:var(--fog-mid);color:var(--text-muted)}
@media (prefers-color-scheme:dark){
  .authority-official{background:#0e2e14;color:#6ed888}
  .authority-press{background:#0e1e38;color:#90b4e8}
  .authority-other{background:var(--fog-mid);color:var(--text-muted)}
}

/* ---- Empty state ---- */
#empty-state{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  padding:40px 24px;
  text-align:center;
}
#empty-state.show{display:flex}

.empty-headline{
  font-family:var(--serif);
  font-size:28px;
  font-weight:400;
  color:var(--ink);
  margin-bottom:24px;
  line-height:1.3;
}

.example-prompts{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:520px;
  width:100%;
}

.example-prompt{
  padding:12px 16px;
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  font-size:14px;
  color:var(--text-secondary);
  cursor:pointer;
  text-align:left;
  transition:border-color .15s, color .15s;
}
.example-prompt:hover{border-color:var(--cobalt);color:var(--ink)}
.example-prompt:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

/* ---- Input area ---- */
#input-area{
  border-top:1px solid var(--rule);
  background:var(--surface);
  padding:12px 24px 14px;
  flex-shrink:0;
}

.input-row{
  display:flex;
  gap:10px;
  align-items:flex-end;
  max-width:720px;
  margin:0 auto;
}

#textarea{
  flex:1;
  font-family:var(--sans);
  font-size:15px;
  color:var(--ink);
  background:var(--fog);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  padding:10px 14px;
  resize:none;
  overflow:hidden;
  min-height:42px;
  max-height:200px;
  line-height:1.5;
  transition:border-color .15s;
}
#textarea:focus{outline:none;border-color:var(--cobalt)}
#textarea::placeholder{color:var(--text-muted)}

#send-btn{
  padding:10px 18px;
  background:var(--cobalt);
  color:#fff;
  border:none;
  border-radius:var(--radius);
  font-family:var(--sans);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  flex-shrink:0;
  transition:background .15s;
  align-self:flex-end;
}
#send-btn:hover{background:var(--cobalt-light)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
#send-btn:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;outline-color:var(--cobalt-light)}

/* ---- Responsive: 390px ---- */
@media (max-width:640px){
  #rail{display:none}
  .msg-gutter{display:none}
  .msg-row{padding:5px 14px;gap:0}
  #input-area{padding:10px 14px 12px}
  .day-marker{padding:16px 14px 6px}
}
</style>
</head>
<body>
<div id="app">
  <!-- Left rail -->
  <nav id="rail" aria-label="Conversations">
    <div id="wordmark">Ledger<span>.</span></div>
    <button id="new-btn" aria-label="New conversation">+ New conversation</button>
    <div id="sessions-list" role="list" aria-label="Past conversations"></div>
  </nav>

  <!-- Main -->
  <main id="main">
    <div id="messages" role="log" aria-live="polite" aria-label="Conversation">
      <div id="empty-state" class="show" aria-label="Start a conversation">
        <p class="empty-headline">Ask it about last week.</p>
        <ul class="example-prompts" role="list">
          <li>
            <button class="example-prompt" role="listitem">
              On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing or shipped something big since?
            </button>
          </li>
          <li>
            <button class="example-prompt" role="listitem">
              What did I ask you on 3 November? Is your answer still correct today?
            </button>
          </li>
          <li>
            <button class="example-prompt" role="listitem">
              Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?
            </button>
          </li>
        </ul>
      </div>
    </div>

    <div id="input-area">
      <div class="input-row">
        <textarea
          id="textarea"
          rows="1"
          placeholder="Ask about anything time-sensitive…"
          aria-label="Message"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="send-btn" aria-label="Send message">Send</button>
      </div>
    </div>
  </main>
</div>

<script>
// ---- State ----
let sessionId = newId();
let isStreaming = false;
let pendingTrail = null; // the current assistant's trail element
let pendingAnswer = null; // the streaming answer text node container
let pendingSourcesData = [];
let raf = null;
let tokenBuffer = '';

// ---- Utilities ----
function newId() {
  return 'sess-' + crypto.randomUUID().replace(/-/g, '').slice(0, 16);
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Render [n] as superscript links; keep the rest of text safe
function renderAnswerText(raw, sources) {
  // Escape HTML but render [n] as citations
  const escaped = esc(raw);
  return escaped.replace(/\[(\d+)\]/g, (_, n) => {
    const idx = parseInt(n, 10);
    const src = sources.find(s => s.index === idx);
    const href = src ? esc(src.url) : '#';
    return `<sup><a href="${href}" target="_blank" rel="noopener noreferrer" title="${src ? esc(src.title) : 'Source ' + n}">[${n}]</a></sup>`;
  });
}

function formatTime(isoStr) {
  const d = new Date(isoStr);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function formatDayLabel(isoStr) {
  const d = new Date(isoStr);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

let lastDayKey = null;

function maybeAddDayMarker(timeIso) {
  const d = new Date(timeIso);
  const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  if (key !== lastDayKey) {
    lastDayKey = key;
    const div = document.createElement('div');
    div.className = 'day-marker';
    div.innerHTML = `
      <div class="day-marker-line"></div>
      <div class="day-marker-label">${esc(formatDayLabel(timeIso))}</div>
      <div class="day-marker-line"></div>
    `;
    messages.appendChild(div);
  }
}

// ---- Render messages ----
function addUserMessage(text, timeIso) {
  maybeAddDayMarker(timeIso);
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="msg-gutter"><span class="msg-time">${esc(formatTime(timeIso))}</span></div>
    <div class="msg-body">${esc(text)}</div>
  `;
  messages.appendChild(row);
  scrollToBottom();
}

function addAssistantRow(timeIso) {
  maybeAddDayMarker(timeIso || new Date().toISOString());
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `
    <div class="msg-gutter"><span class="msg-time">${timeIso ? esc(formatTime(timeIso)) : ''}</span></div>
    <div class="msg-body">
      <div class="answer-text" data-raw=""></div>
      <div class="trail"></div>
    </div>
  `;
  messages.appendChild(row);
  pendingAnswer = row.querySelector('.answer-text');
  pendingTrail = row.querySelector('.trail');
  pendingSourcesData = [];
  tokenBuffer = '';
  scrollToBottom();
  return row;
}

function flushTokens() {
  if (!pendingAnswer || tokenBuffer === '') return;
  pendingAnswer.dataset.raw += tokenBuffer;
  tokenBuffer = '';
  pendingAnswer.innerHTML = renderAnswerText(pendingAnswer.dataset.raw, pendingSourcesData);
  scrollToBottom();
  raf = null;
}

function appendToken(text) {
  tokenBuffer += text;
  if (!raf) raf = requestAnimationFrame(flushTokens);
}

function addTrailItem(text, pulsing) {
  if (!pendingTrail) return;
  const item = document.createElement('div');
  item.className = 'trail-item';
  const dot = document.createElement('div');
  dot.className = 'trail-dot' + (pulsing ? ' pulsing' : '');
  const span = document.createElement('span');
  // Highlight dates in amber
  span.innerHTML = text.replace(/(\d{4}-\d{2}-\d{2})/g, '<span class="date-mark">$1</span>');
  item.appendChild(dot);
  item.appendChild(span);
  pendingTrail.appendChild(item);
  // Remove pulsing from previous items
  if (pulsing) {
    for (const d of pendingTrail.querySelectorAll('.trail-dot.pulsing')) {
      if (d !== dot) { d.classList.remove('pulsing'); }
    }
  }
}

function stopPulsing() {
  if (!pendingTrail) return;
  for (const d of pendingTrail.querySelectorAll('.trail-dot.pulsing')) {
    d.classList.remove('pulsing');
  }
}

function finalizeSources(sources) {
  if (!pendingAnswer || !sources || sources.length === 0) return;
  pendingSourcesData = sources;
  // Re-render with citations
  pendingAnswer.innerHTML = renderAnswerText(pendingAnswer.dataset.raw, sources);

  // Add sources toggle
  const body = pendingAnswer.parentElement;
  const toggle = document.createElement('button');
  toggle.className = 'sources-toggle';
  toggle.textContent = `${sources.length} source${sources.length !== 1 ? 's' : ''}`;
  toggle.setAttribute('aria-expanded', 'false');
  toggle.setAttribute('aria-controls', 'sources-' + Date.now());

  const list = document.createElement('div');
  list.className = 'sources-list';
  list.id = toggle.getAttribute('aria-controls');

  for (const src of sources) {
    const item = document.createElement('div');
    item.className = 'source-item';
    const authClass = `authority-${src.authority}`;
    item.innerHTML = `
      <span class="source-num">[${src.index}]</span>
      <a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.title || src.url)}</a>
      <span class="source-authority ${authClass}">${esc(src.authority)}</span>
      ${src.publishedDate && src.publishedDate !== 'no publish date' ? `<span class="date-mark"> · ${esc(src.publishedDate)}</span>` : ''}
    `;
    list.appendChild(item);
  }

  toggle.addEventListener('click', () => {
    const open = list.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  body.appendChild(toggle);
  body.appendChild(list);
}

// ---- SSE event handlers ----
function onAnchors(data) {
  if (!data.anchors) return;
  for (const a of data.anchors) {
    const fb = a.fallback ? ` (fallback: ${a.fallback})` : '';
    addTrailItem(`Reading "${esc(a.text)}" as ${a.day}${fb}`, false);
  }
}

function onMemory(data) {
  if (data.count > 0) {
    addTrailItem(`Recalled ${data.count} message${data.count !== 1 ? 's' : ''} from ${data.daysCovered.join(', ')}`, false);
  }
}

function onSearch(data) {
  const qs = (data.queries || []).map(q => `"${esc(q)}"`).join(', ');
  const sinceStr = data.since ? ` since ${data.since}` : '';
  addTrailItem(`Searching ${qs}${sinceStr}`, true);
}

function onSources(data) {
  if (data.sources) {
    pendingSourcesData = data.sources;
  }
}

function onDone(data) {
  if (raf) { cancelAnimationFrame(raf); flushTokens(); }
  stopPulsing();
  if (data.sources && data.sources.length > 0) {
    finalizeSources(data.sources);
    addTrailItem(`${data.sources.length} source${data.sources.length !== 1 ? 's' : ''} · ${data.stats?.searches || 0} searches · ${data.stats?.totalMs || 0}ms`, false);
  } else {
    if (pendingTrail && pendingTrail.children.length === 0) {
      pendingTrail.style.display = 'none';
    }
  }
  setStreaming(false);
  loadSessions();
}

function onError(data) {
  if (raf) { cancelAnimationFrame(raf); flushTokens(); }
  stopPulsing();
  if (pendingTrail) {
    addTrailItem(`Error: ${esc(data.message || 'Unknown error')}`, false);
  }
  setStreaming(false);
}

// ---- Send message ----
async function send(text) {
  if (isStreaming || !text.trim()) return;
  hideEmpty();
  setStreaming(true);

  const now = new Date().toISOString();
  addUserMessage(text, now);
  addAssistantRow();

  const tzOffset = new Date().getTimezoneOffset();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: text, tzOffset }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Request failed' }));
      onError({ message: err.error || `HTTP ${res.status}` });
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let curEvent = 'message';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          curEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const dataStr = line.slice(6).trim();
          let data;
          try { data = JSON.parse(dataStr); } catch { data = { text: dataStr }; }

          switch (curEvent) {
            case 'anchors': onAnchors(data); break;
            case 'memory': onMemory(data); break;
            case 'search': onSearch(data); break;
            case 'sources': onSources(data); break;
            case 'token': appendToken(data.text || ''); break;
            case 'done': onDone(data); break;
            case 'error': onError(data); break;
          }
          curEvent = 'message';
        }
      }
    }
  } catch (err) {
    onError({ message: 'Connection error. Please try again.' });
  }
}

// ---- UI helpers ----
const messages = document.getElementById('messages');
const textarea = document.getElementById('textarea');
const sendBtn = document.getElementById('send-btn');
const emptyState = document.getElementById('empty-state');
const sessionsList = document.getElementById('sessions-list');

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function hideEmpty() {
  emptyState.classList.remove('show');
}

function setStreaming(val) {
  isStreaming = val;
  sendBtn.disabled = val;
  textarea.disabled = val;
}

function autosize() {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
}

// ---- Sessions ----
async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    const sessions = await res.json();
    sessionsList.innerHTML = '';
    for (const s of sessions.reverse()) {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === sessionId ? ' active' : '');
      item.setAttribute('role', 'listitem');
      item.setAttribute('tabindex', '0');
      item.setAttribute('aria-label', s.title);
      item.innerHTML = `${esc(s.title)}<span class="session-date">${esc(new Date(s.lastActivity).toLocaleDateString())}</span>`;
      item.addEventListener('click', () => switchSession(s.id));
      item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchSession(s.id); }});
      sessionsList.appendChild(item);
    }
  } catch {}
}

async function switchSession(id) {
  if (id === sessionId) return;
  sessionId = id;
  lastDayKey = null;
  messages.innerHTML = '';
  emptyState.classList.remove('show');
  messages.appendChild(emptyState);

  try {
    const res = await fetch(`/api/sessions/${id}`);
    const session = await res.json();
    if (!session.messages || session.messages.length === 0) {
      emptyState.classList.add('show');
      return;
    }
    for (const m of session.messages) {
      if (m.role === 'user') {
        addUserMessage(m.content, m.at);
      } else {
        const row = addAssistantRow(m.at);
        pendingAnswer.dataset.raw = m.content;
        pendingAnswer.innerHTML = renderAnswerText(m.content, m.sources || []);
        if (m.sources && m.sources.length > 0) {
          finalizeSources(m.sources);
        }
        if (pendingTrail && pendingTrail.children.length === 0) {
          pendingTrail.style.display = 'none';
        }
      }
    }
    scrollToBottom();
  } catch {}

  loadSessions();
}

function newSession() {
  sessionId = newId();
  lastDayKey = null;
  messages.innerHTML = '';
  messages.appendChild(emptyState);
  emptyState.classList.add('show');
  pendingAnswer = null;
  pendingTrail = null;
  loadSessions();
}

// ---- Event listeners ----
document.getElementById('new-btn').addEventListener('click', newSession);

textarea.addEventListener('input', autosize);
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = textarea.value.trim();
    if (text) {
      textarea.value = '';
      autosize();
      send(text);
    }
  }
});

sendBtn.addEventListener('click', () => {
  const text = textarea.value.trim();
  if (text) {
    textarea.value = '';
    autosize();
    send(text);
  }
});

document.querySelectorAll('.example-prompt').forEach(btn => {
  btn.addEventListener('click', () => {
    const text = btn.textContent.trim();
    hideEmpty();
    textarea.value = text;
    autosize();
    textarea.focus();
  });
});

// ---- Init ----
loadSessions();
</script>
</body>
</html>
